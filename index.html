const jbFetch = async (key, bin) => {
  try {
    const r = await fetch(JB+'/'+bin+'/latest', { headers:{ 'X-Master-Key':key, 'X-Bin-Meta':'false' } });
    if(!r.ok){ console.error('jbFetch Fehler:', r.status, r.statusText, '| Bin:', bin, '| Key-Anfang:', key.slice(0,10)); return null; }
    const d = await r.json();
    if(Array.isArray(d)) return d;
    if(Array.isArray(d.record)) return d.record;
    return [];
  } catch(e) { console.error('jbFetch Exception:', e); return null; }
};
const jbSave = async (key, bin, data) => {
  try {
    const r = await fetch(JB+'/'+bin, { method:'PUT', headers:{ 'Content-Type':'application/json','X-Master-Key':key }, body:JSON.stringify(data) });
    if(!r.ok) console.error('jbSave error:', r.status, await r.text());
    return r.ok;
  } catch(e) { console.error('jbSave exception:', e); return false; }
};

  const [bulkMsg, setBulkMsg] = useState('');

  useEffect(() => {
    const def = DEFAULT_CONFIG;
    const c  = lsG('camp_sb') ||(def&&def.camp);   if(c)  setCampS(c);  else setCampS(PRESET.c);
    const p  = lsG('prods_sb')||(def&&def.prods);  if(p)  setProdsS(p); else setProdsS(PRESET.p);
    const k  = lsG('jbKey_sb')||(def&&def.jbKey);  if(k)  setJbKeyS(k);
    const b  = lsG('jbBin_sb')||(def&&def.jbBin);  if(b)  setJbBinS(b);
    const g  = lsG('gsUrl_sb')||(def&&def.gsUrl);  if(g)  setGsUrlS(g);
    const pw = lsG('adminPwd_sb')||(def&&def.adminPwd); if(pw) setAdminPwdS(pw);
    const eu = lsG('emailUrl_sb')||(def&&def.emailUrl); if(eu) setEmailUrlS(eu);
    const pu = lsG('paymentUrl_sb')||(def&&def.paymentUrl); if(pu) setPaymentUrlS(pu);
    setReady(true);
  }, []);

  const saveCamp     = c => { setCampS(c);      lsS('camp_sb',c); };
  const saveProds    = p => { setProdsS(p);     lsS('prods_sb',p); };
  const saveKey      = k => { setJbKeyS(k);     lsS('jbKey_sb',k); };
  const saveBin      = b => { setJbBinS(b);     lsS('jbBin_sb',b); };
  const saveGsUrl    = g => { setGsUrlS(g);     lsS('gsUrl_sb',g); };
  const saveAdminPwd = p => { setAdminPwdS(p);  lsS('adminPwd_sb',p); };
  const saveEmailUrl = u => { setEmailUrlS(u); lsS('emailUrl_sb',u); };
  const savePaymentUrl = u => { setPaymentUrlS(u); lsS('paymentUrl_sb',u); };
  const saveOrds     = o => { setOrdsS(o); };

  const loadOrders = async () => {
    if(!jbKey||!jbBin){ setFetchErr('Kein API-Key oder Bin-ID konfiguriert (Einstellungen prüfen).'); return; }
    setFetch(true); setFetchErr('');
    const d = await jbFetch(jbKey, jbBin);
    if(d) setOrdsS(d.filter(o=>o.id&&o.buyer&&Array.isArray(o.items)&&!o._cleared&&!o._reset&&!o.init));
    else setFetchErr('JSONbin nicht erreichbar – bitte F12 → Konsole prüfen (Fehlermeldung dort) oder Seite neu laden.');
    setFetch(false);
  };

  useEffect(() => { if(aok) loadOrders(); }, [aok]);

  const cartQty = Object.values(cart).reduce((a,b)=>a+b,0);
  const cartTot = Object.entries(cart).reduce((s,[id,qty])=>{
    const p = prods.find(x=>x.id===id); return s+qty*(toN(p?.preis)||toN(p?.uvp)||0);
  },0);

  const setQty = (id,d) => setCart(c=>({...c,[id]:Math.max(0,(c[id]||0)+d)}));

  const submit = async () => {
    if(!buyer.name.trim()||!buyer.email.trim()||cartQty===0) return;
    if(!jbKey||!jbBin){ setSubErr('Admin muss noch die JSONBin-Verbindung einrichten.'); return; }
    setSub(true); setSubErr('');
    const items = Object.entries(cart).filter(([_,q])=>q>0).map(([id,qty])=>{
      const p = prods.find(x=>x.id===id);
      return { productId:id, name:p.name, qty, preis:toN(p.preis)||toN(p.uvp)||0 };
    });
    const cur = await jbFetch(jbKey,jbBin);
    if(cur===null){ setSub(false); setSubErr('Verbindung fehlgeschlagen – API Key prüfen.'); return; }
    const ok = await jbSave(jbKey,jbBin,[...cur.filter(o=>o.id&&o.buyer&&o.items),{id:gId(),ts:new Date().toISOString(),buyer:{...buyer},items}]);
    setSub(false);
    if(ok){
      if(emailUrl) {
        const orderObj = {ts:new Date().toISOString(), buyer:{...buyer}, items};
        fetch(emailUrl, { method:'POST', body:JSON.stringify(orderObj) }).catch(()=>{});
      }
      setCart({}); setBuyer({name:'',email:'',note:''}); setPage('success');
    }
    else setSubErr('Fehler beim Speichern – bitte nochmal versuchen.');
  };

  const pushToSheets = async () => {
    if(!gsUrl) return;
    setGsPush(true); setGsMsg('');
    const hdr = ['Datum','Name','E-Mail','Bestell-Nr.','Artikel','Menge','Einzelpreis','Gesamt','Notiz'];
    const rows = [];
    orders.forEach(o => {
      let personTotal = 0;
      o.items.forEach(i => {
        const pr = prods.find(x=>x.id===i.productId);
        const gesamt = i.qty * i.preis;
        personTotal += gesamt;
        rows.push([
          new Date(o.ts).toLocaleDateString('de-DE'),
          o.buyer.name, o.buyer.email,
          pr?.nr||'', i.name, i.qty,
          i.preis?i.preis.toFixed(2).replace('.',',')+' €':'',
          gesamt.toFixed(2).replace('.',',')+' €',
          o.buyer.note||''
        ]);
      });
      rows.push(['','','GESAMT '+o.buyer.name,'','','','',personTotal.toFixed(2).replace('.',',')+' €','']);
      rows.push(['','','','','','','','','']);
    });
    try {
      const r = await fetch(gsUrl, { method:'POST', body:JSON.stringify([hdr,...rows]) });
      const t = await r.text();
      setGsMsg(t==='ok' ? '✓ Erfolgreich ins Sheet übertragen!' : 'Fehler: '+t);
    } catch(e) { setGsMsg('Fehler: '+e.message); }
    setGsPush(false);
  };

  const exportHTML = async () => {
    try {
      const resp = await fetch(window.location.href);
      let src = await resp.text();
      const cfg = { camp, prods, jbKey, jbBin, gsUrl, adminPwd, emailUrl, paymentUrl };
      src = src.replace(
        /\/\* DEFAULT_CONFIG_START \*\/[\s\S]*?\/\* DEFAULT_CONFIG_END \*\//,
        '/* DEFAULT_CONFIG_START */' + String.fromCharCode(10) + 'const DEFAULT_CONFIG = '+JSON.stringify(cfg)+';' + String.fromCharCode(10) + '/* DEFAULT_CONFIG_END */'
      );
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([src],{type:'text/html;charset=utf-8'}));
      a.download = 'index.html';
      a.click();
    } catch(e) { alert('Export fehlgeschlagen: '+e.message); }
  };

  const exportCSV = () => {
    const hdr = ['Datum','Name','E-Mail','Artikel','Bestell-Nr.','Menge','Einzelpreis','Gesamt','Notiz'];
    const rows = orders.flatMap(o=>o.items.map(i=>{
      const pr = prods.find(x=>x.id===i.productId);
      return [new Date(o.ts).toLocaleDateString('de-DE'),o.buyer.name,o.buyer.email,i.name,pr?.nr||'',i.qty,
        i.preis?i.preis.toFixed(2).replace('.',',')+'€':'',
        (i.qty*i.preis).toFixed(2).replace('.',',')+'€',o.buyer.note||''];
    }));
    const csv = "﻿"+[hdr,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join(String.fromCharCode(10));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download = 'bestellungen-sanct-bernhard.csv';
    a.click();
  };

  const importCSV = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const text = ev.target.result;
        const Q = 34;
        const parseCSV = (str) => {
          const rows = [];
          let row = [], cell = '', inQ = false;
          for(let i = 0; i < str.length; i++) {
            const c = str[i], n = str[i+1];
            const isQ = c.charCodeAt(0) === Q;
            if(inQ) {
              if(isQ && n && n.charCodeAt(0) === Q) { cell += c; i++; }
              else if(isQ) { inQ = false; }
              else { cell += c; }
            } else if(isQ) {
              inQ = true;
            } else if(c === ',' || c === ';') {
              row.push(cell.trim()); cell = '';
            } else if(c.charCodeAt(0) === 10 || c.charCodeAt(0) === 13) {
              if(c.charCodeAt(0) === 13 && n && n.charCodeAt(0) === 10) i++;
              row.push(cell.trim());
              if(row.some(x => x)) rows.push(row);
              row = []; cell = '';
            } else {
              cell += c;
            }
          }
          row.push(cell.trim());
          if(row.some(x => x)) rows.push(row);
          return rows;
        };
        const rows = parseCSV(text);
        const hIdx = rows.findIndex(r => {
          const s = r.join('').toLowerCase();
          return s.includes('name') || s.includes('bestell');
        });
        if(hIdx === -1) { alert('Keine Überschriftenzeile gefunden.'); return; }
        const headers = rows[hIdx].map(h => h.trim().toLowerCase());
        const idx = {
          name:  headers.findIndex(h => h.includes('name')),
          cat:   headers.findIndex(h => h.includes('kategorie') || h.includes('cat')),
          desc:  headers.findIndex(h => h.includes('beschreibung') || h.includes('desc')),
          uvp:   headers.findIndex(h => h.includes('uvp')),
          preis: headers.findIndex(h => h.includes('sammelpreis') || h.includes('preis')),
          img:   headers.findIndex(h => h.includes('foto') || h.includes('img') || h.includes('bild')),
          nr:    headers.findIndex(h => h.includes('bestell')),
        };
        if(idx.name === -1) { alert('Spalte Name nicht gefunden.'); return; }
        const cleanP = v => String(v).replace(/[^0-9,.]/g,'').replace(',','.').trim();
        const parsed = rows.slice(hIdx + 1).map((cols, i) => {
          const nr   = idx.nr   >= 0 ? cols[idx.nr]   : '';
          const name = idx.name >= 0 ? cols[idx.name].split(String.fromCharCode(10)).join(' ').trim() : '';
          if(!name || !/\w/.test(name)) return null;
          return {
            id: 'imp' + Date.now() + i,
            name, nr: nr || '',
            cat:   idx.cat   >= 0 ? cols[idx.cat]           : '',
            desc:  idx.desc  >= 0 ? cols[idx.desc]          : '',
            uvp:   idx.uvp   >= 0 ? cleanP(cols[idx.uvp])   : '',
            preis: idx.preis >= 0 ? cleanP(cols[idx.preis])  : '',
            img:   idx.img   >= 0 ? cols[idx.img]           : '',
          };
        }).filter(Boolean);
        if(!parsed.length) { alert('Keine Artikel gefunden.'); return; }
        const replace = window.confirm(parsed.length + ' Artikel gefunden.' + String.fromCharCode(10,10) + 'OK = Bestehende ersetzen' + String.fromCharCode(10) + 'Abbrechen = Hinzufügen');
        if(replace) saveProds(parsed); else saveProds([...prods, ...parsed]);
        alert(parsed.length + ' Artikel importiert!');
      } catch(err) { alert('Fehler: ' + err.message); }
    };
    reader.readAsText(file, 'UTF-8');
    e.target.value = '';
  };

  if(!ready) return html`<div style=${{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><p style=${{color:'#94a3b8',fontSize:14}}>Wird geladen…</p></div>`;

  if(page==='success') return html`<div style=${{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,textAlign:'center'}}>
    <div style=${{width:72,height:72,borderRadius:'50%',background:'#fee2e2',display:'flex',alignItems:'center',justifyContent:'center',fontSize:36,marginBottom:20}}>✓</div>
    <h1 style=${{fontSize:26,fontWeight:800,color:'#dc2626',marginBottom:10}}>Bestellung eingegangen!</h1>
    <p style=${{color:'#64748b',fontSize:15,marginBottom:28,maxWidth:360,lineHeight:1.6}}>Danke! Wir melden uns, sobald die Sammelbestellung abgeschlossen ist.</p>
    <${Btn} onClick=${()=>setPage('order')} sx=${{padding:'12px 28px',fontSize:15,borderRadius:12}}>Zurück zur Übersicht<//>
  </div>`;

  if(page==='admin'&&!aok) return html`<div style=${{minHeight:'100vh',background:'#f8fafc',display:'flex',alignItems:'center',justifyContent:'center'}}>
    <div style=${{background:'#fff',borderRadius:18,border:'1px solid #e2e8f0',padding:32,width:'100%',maxWidth:340}}>
      <h2 style=${{fontSize:20,fontWeight:800,color:'#0f172a',marginBottom:20}}>Admin-Bereich</h2>
      <input type='password' placeholder='Passwort' style=${{...IS,marginBottom:10}}
        value=${ap} onChange=${e=>setAp(e.target.value)}
        onKeyDown=${e=>e.key==='Enter'&&setAok(ap===adminPwd)} />
      ${ap&&ap!==adminPwd?html`<p style=${{color:'#dc2626',fontSize:13,marginBottom:10}}>Falsches Passwort</p>`:''}
      <${Btn} onClick=${()=>setAok(ap===adminPwd)} sx=${{width:'100%',marginBottom:8,fontSize:14,padding:11}}>Anmelden<//>
      <button onClick=${()=>setPage('order')} style=${{width:'100%',background:'transparent',border:'none',color:'#94a3b8',fontSize:13,cursor:'pointer',padding:8,fontFamily:'inherit'}}>← Zurück</button>
    </div>
  </div>`;

  if(page==='admin'&&aok) {
    const sum={};
    orders.forEach(o=>(o.items||[]).forEach(i=>{sum[i.name]=(sum[i.name]||0)+i.qty;}));
    const tb = k => ({ background:'transparent',border:'none',fontFamily:'inherit',borderBottom:'2px solid '+(atab===k?'#dc2626':'transparent'),color:atab===k?'#dc2626':'#64748b',fontWeight:700,fontSize:13,padding:'12px 16px 10px',cursor:'pointer' });
    return html`<div style=${{minHeight:'100vh',background:'#f8fafc'}}>
      <div style=${{background:'#fff',borderBottom:'1px solid #e2e8f0',padding:'16px 24px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <div style=${{fontSize:11,color:'#94a3b8',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:2}}>Admin · Team Rynkeby RheinRuhr</div>
          <div style=${{fontSize:17,fontWeight:800,color:'#0f172a'}}>${camp.name||'Sammelbestellung'}</div>
        </div>
        <button onClick=${()=>{setAok(false);setPage('order');}} style=${{background:'transparent',border:'none',color:'#94a3b8',fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>← Zur Bestellung</button>
      </div>
      <div style=${{background:'#fff',borderBottom:'1px solid #e2e8f0',display:'flex',padding:'0 24px'}}>
        <button style=${tb('orders')}  onClick=${()=>setAtab('orders')}>Bestellungen (${orders.length})</button>
        <button style=${tb('products')} onClick=${()=>setAtab('products')}>Produkte (${prods.length})</button>
        <button style=${tb('settings')} onClick=${()=>setAtab('settings')}>Einstellungen</button>
      </div>
      <div style=${{maxWidth:680,margin:'0 auto',padding:24}}>

        ${atab==='orders'?html`<div>
          ${fetchErr?html`<div style=${{background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:10,padding:'10px 14px',fontSize:13,color:'#dc2626',marginBottom:12}}>⚠️ ${fetchErr}</div>`:''}
          <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <div style=${{fontSize:15,fontWeight:800,color:'#0f172a'}}>Bestellungen (${orders.length})</div>
            <div style=${{display:'flex',gap:8}}>
              <${Btn} onClick=${loadOrders} col='#475569' sx=${{padding:'8px 14px',fontSize:13,borderRadius:8}}>${fetching?'Lädt…':'↻ Aktualisieren'}<//>
              ${orders.length>0?html`<${Btn} onClick=${exportCSV} col='#0f172a' sx=${{padding:'8px 14px',fontSize:13,borderRadius:8}}>📊 CSV<//>`:'' }
              ${orders.length>0&&gsUrl?html`<${Btn} onClick=${pushToSheets} col='#16a34a' sx=${{padding:'8px 14px',fontSize:13,borderRadius:8,opacity:gsPush?0.6:1}}>${gsPush?'Überträgt…':'📗 Sheets'}<//>`:'' }
              ${orders.length>0&&paymentUrl?html`<${Btn} col=${bulkSending?'#94a3b8':'#7c3aed'} dis=${bulkSending} sx=${{padding:'8px 14px',fontSize:13,borderRadius:8}} onClick=${async()=>{
                if(!window.confirm('Zahlungsaufforderungen an alle '+orders.length+' Besteller senden?\n\nHinweis: Artikel, die in der „Nach Artikel"-Ansicht auf 0 gesetzt wurden, werden in jeder Bestellung entfernt.')) return;
                setBulkSending(true); setBulkMsg('');
                let sent=0, failed=0;
                for(const o of orders){
                  const items=(editOrders[o.id]||o.items).map(i=>{
                    const avail=artikelAvail[i.name];
                    if(avail===undefined) return i;
                    const ratio=(sum[i.name]||1)===0?0:avail/(sum[i.name]||1);
                    return {...i,qty:Math.round(i.qty*ratio)};
                  }).filter(i=>i.qty>0);
                  if(!items.length) continue;
                  try{const r=await fetch(paymentUrl,{method:'POST',body:JSON.stringify({buyer:o.buyer,items,ts:o.ts})});if(r.ok)sent++;else failed++;}
                  catch{failed++;}
                }
                setBulkSending(false);
                setBulkMsg(failed===0?'✓ '+sent+' Zahlungsaufforderungen gesendet!':'⚠ '+sent+' gesendet, '+failed+' fehlgeschlagen.');
              }}>💶 ${bulkSending?'Sendet…':'Zahlungsaufforderung'}<//>`:'' }
            </div>
          </div>
          <div style=${{display:'flex',gap:0,marginBottom:16,background:'#f1f5f9',borderRadius:10,padding:3}}>
            <button onClick=${()=>setOrdersView('person')} style=${{flex:1,border:'none',borderRadius:8,padding:'7px 0',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit',background:ordersView==='person'?'#fff':'transparent',color:ordersView==='person'?'#0f172a':'#64748b',boxShadow:ordersView==='person'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>Nach Person</button>
            <button onClick=${()=>setOrdersView('artikel')} style=${{flex:1,border:'none',borderRadius:8,padding:'7px 0',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit',background:ordersView==='artikel'?'#fff':'transparent',color:ordersView==='artikel'?'#7c3aed':'#64748b',boxShadow:ordersView==='artikel'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>Nach Artikel</button>
          </div>
          ${gsMsg?html`<p style=${{fontSize:13,marginBottom:12,color:gsMsg[0]==='✓'?'#16a34a':'#dc2626'}}>${gsMsg}</p>`:''}
          ${!jbKey||!jbBin?html`<div style=${{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:12,padding:16,fontSize:13,color:'#92400e'}}>⚠ Bitte JSONBin-Zugangsdaten unter Einstellungen hinterlegen.</div>`:html`<div>

            ${ordersView==='artikel'?html`<div>
              ${orders.length===0?html`<div style=${{textAlign:'center',padding:'48px 0',color:'#94a3b8',fontSize:14}}>Noch keine Bestellungen.</div>`:html`<div>
                <p style=${{fontSize:13,color:'#64748b',lineHeight:1.5,marginBottom:16}}>Setze nicht lieferbare Artikel auf <strong>0</strong> — das wird in allen Bestellungen berücksichtigt. Dann einmal <strong>„Alle senden"</strong> klicken.</p>
                <div style=${{display:'flex',flexDirection:'column',gap:8,marginBottom:20}}>
                  ${Object.entries(sum).map(([name,totalQty])=>{
                    const avail=artikelAvail[name]===undefined?totalQty:artikelAvail[name];
                    const out=avail===0;
                    return html`<div key=${name} style=${{background:'#fff',border:'1px solid '+(out?'#fecaca':'#e2e8f0'),borderRadius:12,padding:'12px 16px',display:'flex',alignItems:'center',gap:12}}>
                      <div style=${{flex:1}}>
                        <div style=${{fontSize:13,fontWeight:600,color:out?'#94a3b8':'#0f172a',textDecoration:out?'line-through':'none'}}>${name}</div>
                        <div style=${{fontSize:11,color:'#94a3b8',marginTop:2}}>Bestellt: ${totalQty}×</div>
                      </div>
                      <input type='number' min='0' max=${totalQty} style=${{width:60,border:'1px solid #e2e8f0',borderRadius:6,padding:'4px 8px',fontSize:13,textAlign:'center',fontFamily:'inherit'}}
                        value=${avail}
                        onChange=${e=>{const v=Math.max(0,Math.min(totalQty,parseInt(e.target.value)||0));setArtikelAvail(a=>({...a,[name]:v}));}} />
                      <button onClick=${()=>setArtikelAvail(a=>({...a,[name]:out?totalQty:0}))} style=${{fontSize:11,border:'1px solid #e2e8f0',borderRadius:6,padding:'5px 10px',cursor:'pointer',background:out?'#fee2e2':'#f8fafc',color:out?'#dc2626':'#64748b',fontWeight:700,fontFamily:'inherit'}}>${out?'✓ Nicht lieferbar':'Auf 0 setzen'}</button>
                    </div>`;
                  })}
                </div>
                ${bulkMsg?html`<p style=${{fontSize:13,marginTop:4,fontWeight:700,color:bulkMsg[0]==='✓'?'#16a34a':'#dc2626'}}>${bulkMsg}</p>`:''}
              </div>`}
            </div>`:''}

            ${ordersView==='person'?html`<div>
              ${Object.keys(sum).length>0?html`<div style=${{marginBottom:20}}>
                <div style=${{fontSize:11,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:10}}>Gesamtübersicht</div>
                <div style=${{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:10,marginBottom:16}}>
                  ${Object.entries(sum).map(([name,qty])=>html`<div key=${name} style=${{background:'#fff',border:'1px solid #e2e8f0',borderRadius:12,padding:'14px 16px'}}>
                    <div style=${{fontSize:30,fontWeight:800,color:'#dc2626',lineHeight:1}}>${qty}×</div>
                    <div style=${{fontSize:12,color:'#475569',fontWeight:600,marginTop:5,lineHeight:1.3}}>${name}</div>
                  </div>`)}
                </div>
              </div>`:''}
              ${orders.length===0?html`<div style=${{textAlign:'center',padding:'48px 0',color:'#94a3b8',fontSize:14}}>Noch keine Bestellungen. Klicke auf Aktualisieren.</div>`:html`<div style=${{display:'flex',flexDirection:'column',gap:10}}>
                ${orders.map(o=>html`<div key=${o.id} style=${{background:'#fff',border:'1px solid #e2e8f0',borderRadius:12,overflow:'hidden'}}>
                  <button onClick=${()=>setExp(exp===o.id?null:o.id)} style=${{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 18px',background:'transparent',border:'none',cursor:'pointer',textAlign:'left',fontFamily:'inherit'}}>
                    <div><span style=${{fontWeight:700,color:'#0f172a',fontSize:14}}>${o.buyer.name}</span><span style=${{color:'#94a3b8',fontSize:13,marginLeft:10}}>${o.buyer.email}</span></div>
                    <div style=${{textAlign:'right'}}>
                      <div style=${{fontSize:11,color:'#94a3b8'}}>${new Date(o.ts).toLocaleDateString('de-DE')}</div>
                      <div style=${{fontSize:13,color:'#64748b'}}>${o.items.reduce((s,i)=>s+i.qty,0)} Artikel</div>
                    </div>
                  </button>
                  ${exp===o.id?html`<div style=${{borderTop:'1px solid #f1f5f9',padding:'14px 18px',background:'#f8fafc'}}>
                    ${(editOrders[o.id]||o.items).map((i,ix)=>html`<div key=${ix} style=${{display:'flex',alignItems:'center',gap:8,padding:'4px 0',borderBottom:'1px solid #f1f5f9'}}>
                      <span style=${{flex:1,fontSize:13,color:'#374151'}}>${i.name}</span>
                      <input type='number' min='0' style=${{width:52,border:'1px solid #e2e8f0',borderRadius:6,padding:'3px 6px',fontSize:13,textAlign:'center',fontFamily:'inherit'}}
                        value=${i.qty}
                        onChange=${e=>{const qty=Math.max(0,parseInt(e.target.value)||0);const cur=editOrders[o.id]||[...o.items];const upd=cur.map((x,j)=>j===ix?{...x,qty}:x);setEditOrders(ev=>({...ev,[o.id]:upd}));}} />
                      <span style=${{fontSize:12,color:'#64748b',minWidth:60,textAlign:'right'}}>${(i.qty*(i.preis||0)).toFixed(2).replace('.',',')} €</span>
                      <button title='Entfernen' onClick=${()=>{const cur=editOrders[o.id]||[...o.items];const upd=cur.filter((_,j)=>j!==ix);setEditOrders(ev=>({...ev,[o.id]:upd}));}} style=${{background:'transparent',border:'none',color:'#dc2626',cursor:'pointer',fontSize:16,padding:'0 4px',fontFamily:'inherit'}}>✕</button>
                    </div>`)}
                    ${o.buyer.note?html`<p style=${{fontSize:12,color:'#94a3b8',marginTop:8,fontStyle:'italic'}}>"${o.buyer.note}"</p>`:''}
                    <div style=${{marginTop:12,display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                      ${paymentUrl?html`<${Btn} col='#7c3aed' sx=${{padding:'8px 16px',fontSize:13,borderRadius:8}} onClick=${async()=>{
                        const items=(editOrders[o.id]||o.items).filter(i=>i.qty>0);
                        if(!items.length){alert('Keine Artikel in der Bestellung.');return;}
                        setPayMsg(m=>({...m,[o.id]:'Sendet…'}));
                        try{const r=await fetch(paymentUrl,{method:'POST',body:JSON.stringify({buyer:o.buyer,items,ts:o.ts})});const t=await r.text();setPayMsg(m=>({...m,[o.id]:t==='ok'?'✓ Zahlungsaufforderung gesendet!':'Fehler: '+t}));}
                        catch(e){setPayMsg(m=>({...m,[o.id]:'Fehler: '+e.message}));}
                      }}>💶 Zahlungsaufforderung senden<//>`:'' }
                      ${editOrders[o.id]?html`<button onClick=${()=>setEditOrders(ev=>{const n={...ev};delete n[o.id];return n;})} style=${{fontSize:12,color:'#64748b',border:'1px solid #e2e8f0',background:'transparent',borderRadius:8,padding:'7px 12px',cursor:'pointer',fontFamily:'inherit'}}>↩ Änderungen verwerfen</button>`:''}
                    </div>
                    ${payMsg[o.id]?html`<p style=${{fontSize:12,marginTop:8,color:payMsg[o.id][0]==='✓'?'#16a34a':'#dc2626',fontWeight:600}}>${payMsg[o.id]}</p>`:''}
                  </div>`:''}
                </div>`)}
              </div>`}
            </div>`:''}

          </div>`}
        </div>`:''}
        ${atab==='products'?html`<div>
          <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <div style=${{fontSize:15,fontWeight:800,color:'#0f172a'}}>Produkte</div>
            <div style=${{display:'flex',gap:8}}>
              <label style=${{background:'#475569',color:'#fff',borderRadius:8,padding:'8px 14px',fontSize:13,fontWeight:700,cursor:'pointer'}}>
                📥 CSV importieren
                <input type='file' accept='.csv' onChange=${importCSV} style=${{display:'none'}} />
              </label>
              <${Btn} onClick=${()=>setNewP({id:gId(),name:'',nr:'',cat:'',desc:'',img:'',uvp:'',preis:''})} sx=${{padding:'8px 16px',fontSize:13,borderRadius:8}}>+ Hinzufügen<//>
            </div>
          </div>
          <div style=${{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,padding:'10px 14px',fontSize:12,color:'#64748b',marginBottom:14}}>
            📋 CSV-Format: <b>Bestell-Nr.;Name;UVP;Sammelpreis;Foto-URL</b> (erste Zeile = Überschriften)
          </div>
          ${newP?html`<${PForm} p=${newP} onChange=${setNewP} onSave=${()=>{saveProds([...prods,newP]);setNewP(null);}} onCancel=${()=>setNewP(null)} />` :''}
          <div style=${{display:'flex',flexDirection:'column',gap:8}}>
            ${prods.map(p=>editP?.id===p.id?html`<${PForm} key=${p.id} p=${editP} onChange=${setEditP}
                onSave=${()=>{saveProds(prods.map(x=>x.id===editP.id?editP:x));setEditP(null);}}
                onCancel=${()=>setEditP(null)} />`:html`<div key=${p.id} style=${{background:'#fff',border:'1px solid #e2e8f0',borderRadius:12,padding:'13px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
              <div style=${{flex:1,minWidth:0}}>
                <div style=${{fontWeight:700,fontSize:14,color:'#0f172a'}}>${p.name}</div>
                <div style=${{fontSize:12,color:'#94a3b8',marginTop:2}}>
                  ${p.nr?html`<span style=${{marginRight:10}}>Nr.: ${p.nr}</span>`:''}
                  ${p.uvp?html`<span style=${{marginRight:10}}>UVP: ${fmtP(p.uvp)}</span>`:''}
                  ${p.preis?html`<span style=${{color:'#dc2626',fontWeight:700}}>Sammelpreis: ${fmtP(p.preis)}</span>`:html`<span style=${{color:'#f59e0b',fontWeight:600}}>⚠ Sammelpreis fehlt</span>`}
                </div>
              </div>
              <div style=${{display:'flex',gap:8,flexShrink:0}}>
                <button onClick=${()=>setEditP({...p})} style=${{fontSize:12,color:'#64748b',border:'1px solid #e2e8f0',background:'transparent',borderRadius:8,padding:'6px 12px',cursor:'pointer',fontFamily:'inherit'}}>Bearbeiten</button>
                <button onClick=${()=>saveProds(prods.filter(x=>x.id!==p.id))} style=${{fontSize:12,color:'#dc2626',border:'1px solid #fecaca',background:'transparent',borderRadius:8,padding:'6px 12px',cursor:'pointer',fontFamily:'inherit'}}>Löschen</button>
              </div>
            </div>`)}
          </div>
        </div>`:''}

        ${atab==='settings'?html`<div style=${{display:'flex',flexDirection:'column',gap:20}}>
          <div style=${{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:16,padding:24}}>
            <div style=${{fontSize:15,fontWeight:800,color:'#1e40af',marginBottom:6}}>🔗 JSONBin.io Verbindung</div>
            <div style=${{display:'grid',gap:10}}>
              <div><label style=${lbl}>API Key (X-Master-Key)</label>
                <input type='password' style=${{...IS,borderColor:'#bfdbfe'}} placeholder='...' value=${jbKey} onChange=${e=>saveKey(e.target.value)} />
              </div>
              <div><label style=${lbl}>Bin ID</label>
                <input style=${{...IS,borderColor:'#bfdbfe'}} placeholder='6...' value=${jbBin} onChange=${e=>saveBin(e.target.value)} />
              </div>
            </div>
          </div>
          <div style=${{background:'#fff7ed',border:'1px solid #fed7aa',borderRadius:16,padding:24}}>
            <div style=${{fontSize:15,fontWeight:800,color:'#c2410c',marginBottom:6}}>📧 Bestellbestätigung per E-Mail</div>
            <p style=${{fontSize:13,color:'#ea580c',marginBottom:16,lineHeight:1.6}}>
              Sendet nach jeder Bestellung automatisch eine Bestätigungsmail an den Käufer.<br/>
              Setup: Neues Apps Script → Code einfügen → Als Web-App bereitstellen → URL hier eintragen.
            </p>
            <div><label style=${lbl}>Web-App URL</label>
              <input style=${{...IS,borderColor:'#fed7aa'}} placeholder='https://script.google.com/macros/s/...' value=${emailUrl} onChange=${e=>saveEmailUrl(e.target.value)} />
            </div>
          </div>
          <div style=${{background:'#faf5ff',border:'1px solid #e9d5ff',borderRadius:16,padding:24}}>
            <div style=${{fontSize:15,fontWeight:800,color:'#7c3aed',marginBottom:6}}>💶 Zahlungsaufforderung per E-Mail</div>
            <p style=${{fontSize:13,color:'#7c3aed',marginBottom:16,lineHeight:1.6}}>
              Wird manuell pro Bestellung aus dem Admin-Bereich versendet – nach Lieferantenbestätigung.<br/>
              Enthält Zahlungsdetails (PayPal / Bankverbindung). Getrennte Apps Script URL verwenden.
            </p>
            <div><label style=${lbl}>Web-App URL (Zahlungsaufforderung)</label>
              <input style=${{...IS,borderColor:'#e9d5ff'}} placeholder='https://script.google.com/macros/s/...' value=${paymentUrl} onChange=${e=>savePaymentUrl(e.target.value)} />
            </div>
          </div>
          <div style=${{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:16,padding:24}}>
            <div style=${{fontSize:15,fontWeight:800,color:'#15803d',marginBottom:6}}>📗 Google Sheets Webhook</div>
            <div><label style=${lbl}>Web-App URL</label>
              <input style=${{...IS,borderColor:'#bbf7d0'}} placeholder='https://script.google.com/macros/s/...' value=${gsUrl} onChange=${e=>saveGsUrl(e.target.value)} />
            </div>
          </div>
          <div style=${{background:'#fff',border:'1px solid #e2e8f0',borderRadius:16,padding:24}}>
            <div style=${{fontSize:15,fontWeight:800,color:'#0f172a',marginBottom:16}}>Kampagne</div>
            <div style=${{display:'flex',flexDirection:'column',gap:12}}>
              ${[{k:'name',l:'Titel',ph:'Sammelbestellung Sanct Bernhard'},{k:'sponsor',l:'Sponsor',ph:'Sanct Bernhard'},{k:'deadline',l:'Bestellfrist',ph:'z.B. 15. März 2026'},{k:'description',l:'Info-Text',ph:'Kurze Beschreibung'}].map(f=>html`<div key=${f.k}>
                <label style=${lbl}>${f.l}</label>
                <input style=${IS} placeholder=${f.ph} value=${camp[f.k]} onChange=${e=>saveCamp({...camp,[f.k]:e.target.value})} />
              </div>`)}
            </div>
          </div>
          <div style=${{background:'#fff',border:'1px solid #e2e8f0',borderRadius:16,padding:24}}>
            <div style=${{fontSize:15,fontWeight:800,color:'#0f172a',marginBottom:16}}>🔐 Admin-Passwort ändern</div>
            <div style=${{display:'flex',gap:10}}>
              <input type='password' style=${{...IS,flex:1}} placeholder='Neues Passwort' value=${newPwd} onChange=${e=>setNewPwd(e.target.value)} />
              <${Btn} onClick=${()=>{if(newPwd.trim().length>3){saveAdminPwd(newPwd.trim());setNewPwd('');alert('Passwort geändert!');}else{alert('Mindestens 4 Zeichen.');}}} sx=${{borderRadius:8,padding:'10px 16px',fontSize:13,flexShrink:0}}>Speichern<//>
            </div>
          </div>
          <div style=${{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:16,padding:24}}>
            <div style=${{fontSize:15,fontWeight:800,color:'#15803d',marginBottom:6}}>💾 Als index.html exportieren</div>
            <p style=${{fontSize:13,color:'#16a34a',marginBottom:14,lineHeight:1.5}}>Bäckt alle Einstellungen in eine neue index.html – auf GitHub hochladen.</p>
            <${Btn} col='#15803d' onClick=${exportHTML} sx=${{borderRadius:8,padding:'9px 18px',fontSize:13}}>💾 index.html exportieren<//>
          </div>
          <div style=${{background:'#fff5f5',border:'1px solid #fecaca',borderRadius:16,padding:20}}>
            <div style=${{fontSize:15,fontWeight:800,color:'#991b1b',marginBottom:6}}>⚠ Neue Kampagne starten</div>
            <p style=${{fontSize:13,color:'#b91c1c',marginBottom:14,lineHeight:1.5}}>Löscht alle Bestellungen im Bin. Vorher exportieren!</p>
            <${Btn} col='#dc2626' onClick=${async()=>{if(window.confirm('Wirklich alle Bestellungen löschen?')){
                const ok = await jbSave(jbKey,jbBin,[{"_cleared":true}]);
                if(ok){ saveOrds([]); alert('Bestellungen wurden in JSONBin gelöscht!'); }
                else alert('Fehler: JSONBin nicht erreichbar. Bitte API Key prüfen.');
              }}} sx=${{borderRadius:8,padding:'9px 18px',fontSize:13}}>Bestellungen zurücksetzen<//>
          </div>
        </div>`:''}

      </div>
    </div>`;
  }

  const cats = [...new Set(prods.map(p=>p.cat||'Alle Artikel'))];
  const canSub = buyer.name.trim()&&buyer.email.trim()&&cartQty>0&&!sub;

  return html`<div style=${{minHeight:'100vh',paddingBottom:240}}>
    <div style=${{background:'#fff',borderBottom:'1px solid #f1f5f9',position:'sticky',top:0,zIndex:10}}>
      <div style=${{maxWidth:680,margin:'0 auto',padding:'16px 20px',display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
        <div>
          <div style=${{fontSize:11,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:2}}>Team Rynkeby RheinRuhr</div>
          <h1 style=${{margin:0,fontSize:21,fontWeight:800,color:'#0f172a',lineHeight:1.2}}>${camp.name||'Sammelbestellung'}</h1>
          ${camp.sponsor?html`<div style=${{fontSize:12,color:'#64748b',marginTop:3}}>von ${camp.sponsor}</div>`:''}
          ${camp.deadline?html`<div style=${{fontSize:12,color:'#dc2626',fontWeight:700,marginTop:3}}>⏱ Bestellfrist: ${camp.deadline}</div>`:''}
        </div>
        <button onClick=${()=>setPage('admin')} title='Admin' style=${{background:'transparent',border:'none',color:'#e2e8f0',cursor:'pointer',fontSize:20,padding:4,marginTop:4}}>⚙</button>
      </div>
      ${camp.description?html`<div style=${{maxWidth:680,margin:'0 auto',padding:'0 20px 14px'}}><p style=${{margin:0,fontSize:13,color:'#64748b',lineHeight:1.5}}>${camp.description}</p></div>`:''}
    </div>

    <div style=${{maxWidth:680,margin:'0 auto',padding:'24px 20px 0'}}>
      ${cats.map(cat=>html`<div key=${cat} style=${{marginBottom:28}}>
        ${cats.length>1?html`<div style=${{fontSize:11,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:12}}>${cat}</div>`:''}
        <div style=${{display:'flex',flexDirection:'column',gap:10}}>
          ${prods.filter(p=>(p.cat||'Alle Artikel')===cat).map(p=>{
            const qty=cart[p.id]||0;
            const hasDis=p.preis&&p.uvp&&parseFloat(p.preis)<parseFloat(p.uvp);
            const dp=p.preis||p.uvp;
            return html`<div key=${p.id} style=${{background:'#fff',borderRadius:14,padding:'14px 16px',border:'1px solid '+(qty>0?'#fca5a5':'#e2e8f0'),outline:qty>0?'3px solid #fee2e2':'none',transition:'all 0.15s'}}>
              <div style=${{display:'flex',alignItems:'flex-start',gap:12}}>
                ${p.img?html`<img src=${p.img} alt=${p.name} onError=${e=>{e.target.style.display='none';}} style=${{width:72,height:72,objectFit:'contain',borderRadius:8,border:'1px solid #f1f5f9',flexShrink:0,background:'#f8fafc'}} />`:''}
                <div style=${{flex:1,minWidth:0}}>
                  <div style=${{fontWeight:700,color:'#0f172a',fontSize:14}}>${p.name}</div>
                  ${p.nr?html`<div style=${{fontSize:11,color:'#94a3b8',marginTop:2}}>Bestell-Nr.: ${p.nr}</div>`:''}
                  ${p.desc?html`<p style=${{margin:'4px 0 0',fontSize:12,color:'#64748b',lineHeight:1.5,whiteSpace:'pre-line'}}>${p.desc}</p>`:''}
                </div>
                <div style=${{textAlign:'right',flexShrink:0}}>
                  ${dp?html`<div>
                    ${hasDis?html`<div style=${{fontSize:11,color:'#94a3b8',textDecoration:'line-through'}}>${fmtP(p.uvp)}</div>`:''}
                    <div style=${{fontWeight:800,fontSize:15,color:p.preis?'#dc2626':'#374151'}}>${fmtP(dp)}</div>
                  </div>`:html`<div style=${{fontSize:12,color:'#94a3b8'}}>Preis folgt</div>`}
                </div>
              </div>
              <div style=${{marginTop:12,display:'flex',justifyContent:'flex-end',alignItems:'center',gap:12}}>
                <button onClick=${()=>setQty(p.id,-1)} style=${{width:32,height:32,borderRadius:'50%',border:'1px solid #e2e8f0',background:'transparent',color:'#64748b',fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit'}}>−</button>
                <span style=${{fontWeight:800,fontSize:16,minWidth:20,textAlign:'center',color:qty>0?'#dc2626':'#0f172a'}}>${qty}</span>
                <button onClick=${()=>setQty(p.id,1)} style=${{width:32,height:32,borderRadius:'50%',border:'1px solid '+(qty>0?'transparent':'#dc2626'),background:qty>0?'#dc2626':'transparent',color:qty>0?'#fff':'#dc2626',fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit'}}>+</button>
              </div>
            </div>`;
          })}
        </div>
      </div>`)}
    </div>

    <div style=${{position:'fixed',bottom:0,left:0,right:0,background:'#fff',borderTop:'1px solid #e2e8f0',boxShadow:'0 -4px 20px rgba(0,0,0,0.07)',zIndex:20}}>
      <div style=${{maxWidth:680,margin:'0 auto',padding:'14px 20px'}}>
        <div style=${{display:'flex',gap:10,marginBottom:10}}>
          <input placeholder='Dein Name *' style=${{...IS,flex:1,minWidth:0}} value=${buyer.name} onChange=${e=>setBuyer(b=>({...b,name:e.target.value}))} />
          <input placeholder='E-Mail-Adresse *' type='email' style=${{...IS,flex:1,minWidth:0}} value=${buyer.email} onChange=${e=>setBuyer(b=>({...b,email:e.target.value}))} />
        </div>
        <input placeholder='Anmerkungen (optional)' style=${{...IS,marginBottom:subErr?'6px':'10px'}} value=${buyer.note} onChange=${e=>setBuyer(b=>({...b,note:e.target.value}))} />
        ${subErr?html`<p style=${{fontSize:12,color:'#dc2626',marginBottom:8}}>${subErr}</p>`:''}
        <button onClick=${submit} disabled=${!canSub} style=${{background:canSub?'#dc2626':'#f1f5f9',color:canSub?'#fff':'#94a3b8',border:'none',borderRadius:12,padding:'13px 20px',fontSize:15,fontWeight:800,cursor:canSub?'pointer':'not-allowed',width:'100%',transition:'all 0.15s',fontFamily:'inherit'}}>
          ${sub?'Wird gesendet…':cartQty>0?'Bestellung absenden – '+cartQty+' Artikel'+(cartTot>0?' · '+fmtP(cartTot):''):'Artikel auswählen und Bestellung absenden'}
        </button>
      </div>
    </div>
  </div>`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
